<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift Handover</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;background:#1b1f24;color:#eee}
header{padding:14px 16px;background:#e8a317;color:#111;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
header h1{margin:0;font-size:1.3rem}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:#262c33;border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.05rem;color:#e8a317}
label{display:block;font-size:.85rem;margin:10px 0 4px;color:#bbb}
input,select,textarea{width:100%;padding:10px;font-size:1rem;border-radius:6px;border:1px solid #444;background:#12161a;color:#eee}
textarea{min-height:80px;resize:none;overflow:hidden}
.row{display:flex;gap:10px}.row>*{flex:1}
button{padding:11px 16px;font-size:1rem;border:0;border-radius:6px;background:#e8a317;color:#111;font-weight:600;cursor:pointer}
button.sec{background:#3a424b;color:#eee}
.check{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:1rem;color:#eee}
.check input{width:22px;height:22px}
.entry{border-left:4px solid #e8a317;padding:8px 12px;margin:10px 0;background:#1f242a;border-radius:6px}
.entry.night{border-color:#5b8def}
.entry small{color:#aaa}
.entry pre{white-space:pre-wrap;font-family:inherit;margin:6px 0}
.flag{color:#ff6b6b;font-weight:600}
.ack{color:#6bd68a}
.task{display:flex;align-items:center;gap:10px;padding:8px;margin:6px 0;background:#1f242a;border-radius:6px}
.task input{width:22px;height:22px;flex:none}
.task.done span{text-decoration:line-through;color:#888}
.task .m{font-size:.75rem;color:#aaa;display:block}
.tag{font-size:.7rem;padding:2px 6px;border-radius:4px;background:#5b8def;color:#111;margin-right:6px}
.tag.order{background:#e8a317}.tag.roll{background:#ff6b6b}.tag.recur{background:#b48ef0}
.task button{padding:4px 8px;font-size:.8rem;margin-left:auto}
#lock{position:fixed;inset:0;background:#1b1f24;z-index:10;display:none;align-items:center;justify-content:center;padding:16px}
#lock .card{width:100%;max-width:380px}
#lock .err{color:#ff6b6b;min-height:1.2em;margin:8px 0}
#banner .card{background:#7a2a2a}
#who{display:flex;gap:8px;align-items:center}#who button{padding:5px 10px;font-size:.85rem}
table.r{border-collapse:collapse;width:100%;font-size:.8rem;margin-top:10px}
table.r th,table.r td{border:1px solid #3a424b;padding:5px;text-align:center}
table.r .D{background:#5a4a12}table.r .N{background:#1f3560}table.r .O{background:#1f242a;color:#777}
table.r tr.today td,table.r tr.today th{outline:2px solid #e8a317}
#scanbox{position:fixed;inset:0;background:#000d;z-index:20;display:none;align-items:center;justify-content:center;padding:12px}
#scanbox .card{width:100%;max-width:420px}
#scanmsg{min-height:2.4em;margin:8px 0;color:#6bd68a}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<header><h1>🔧 Shift Handover</h1><div id="who"><span id="sync" style="font-size:.8rem"></span><span id="now"></span><span id="onshift"></span><button id="signoff" class="sec">Sign off</button></div></header>
<div id="scanbox"><div class="card">
  <h2>Scan parts to order</h2>
  <div id="reader"></div>
  <div id="sbstat" style="font-size:.85rem;color:#bbb"></div>
  <form id="sbform" style="display:none;margin:6px 0">
    <div class="row"><input id="sbemail" type="email" placeholder="Parts Tracker email" autocomplete="username"><input id="sbpass" type="password" placeholder="Password" autocomplete="current-password"></div>
    <button style="margin-top:6px;width:100%">Sign in to Parts Tracker</button>
  </form>
  <div id="scanmsg">Point the camera at a barcode. Repeat scans add to the quantity.</div>
  <div class="row"><input id="manual" placeholder="Or type barcode / part no."><button type="button" id="manualadd" style="flex:0 0 auto">Add</button></div>
  <div class="actions"><button type="button" class="sec" id="scandone">Done</button></div>
</div></div>
<div id="lock"><form class="card" id="lockform">
  <h2>Sign on to shift</h2>
  <div id="lockinfo" style="margin-bottom:8px"></div>
  <label>Name</label><select id="su"></select>
  <label>PIN (4–6 digits)</label><input id="spin" type="password" inputmode="numeric" autocomplete="off" maxlength="6">
  <div id="newpin" style="display:none"><label>First time – confirm new PIN</label><input id="spin2" type="password" inputmode="numeric" autocomplete="off" maxlength="6"></div>
  <div class="err" id="lockerr"></div>
  <button style="width:100%">Sign on</button>
</form></div>
<main>
<div id="banner"></div>
<div id="pending"></div>

<div class="card">
  <h2>📋 Day planner – to do &amp; to order</h2>
  <div class="actions" style="margin:0 0 10px"><button type="button" id="tscan">📷 Scan part to order</button>
  <a href="https://9h2c8tksrk-lgtm.github.io/Parts-tracker/" target="_blank" rel="noopener"><button type="button" class="sec">🔩 Open Parts Tracker</button></a></div>
  <form id="tform" class="row" style="align-items:stretch">
    <select id="ttype" style="flex:0 0 120px"><option value="task">Task</option><option value="order">Order part</option></select>
    <input id="ttext" placeholder="Add item…" required style="flex:3">
    <button style="flex:0 0 auto">Add</button>
  </form>
  <div id="tasks"></div>
</div>

<form id="form" class="card">
  <h2>New handover</h2>
  <div class="row">
    <div><label>Handing over (you)</label><select id="from"></select></div>
    <div><label>Taking over</label><select id="to"></select></div>
  </div>
  <div class="row">
    <div><label>Shift ending</label>
      <select id="shift"><option value="Day">Day (5am–5pm)</option><option value="Night">Night (5pm–5am)</option></select></div>
    <div><label>Shift date</label><input type="date" id="date"></div>
  </div>
  <label>Jobs in progress (what's left to do)</label><textarea id="inprog"></textarea>
  <label>Jobs completed</label><textarea id="done"></textarea>
  <label>Parts / stock – ordered, arriving, or running low</label><textarea id="parts"></textarea>
  <label>Equipment, tools & vehicles – faults or out of service</label><textarea id="equip"></textarea>
  <label>Safety issues / incidents / near misses</label><textarea id="safety"></textarea>
  <label>Other notes (deliveries, visitors, customers, callbacks)</label><textarea id="notes"></textarea>
  <h2 style="margin-top:16px">End-of-shift checklist</h2>
  <label class="check"><input type="checkbox" class="chk"> Workshop & store tidied, floors clear</label>
  <label class="check"><input type="checkbox" class="chk"> Tools returned & accounted for</label>
  <label class="check"><input type="checkbox" class="chk"> Parts booked in/out, stock sheet updated</label>
  <label class="check"><input type="checkbox" class="chk"> Hazards made safe / signed off</label>
  <label class="check"><input type="checkbox" class="chk"> Store & vehicles/equipment locked or secured</label>
  <div class="actions"><button type="submit">Submit handover</button><button type="reset" class="sec">Clear</button></div>
</form>

<details class="card" id="rosterbox">
  <summary><b style="color:#e8a317">📅 Roster – 7 days, 7 nights, 7 off</b> <span id="rtoday"></span></summary>
  <div id="roster" style="overflow-x:auto"></div>
</details>

<div class="card">
  <h2>History</h2>
  <div class="actions"><button class="sec" id="export">Export JSON</button><button class="sec" id="clear">Clear all</button></div>
  <div id="history"></div>
</div>
</main>
<script>
const CREW=["Carl","Declan","Lockie"], KEY="handovers.v1", ME="handover.me";
// Everyone who can sign on / hand over. CREW are on the 21-day roster cycle; the rest aren't rostered.
const USERS=[...CREW,"Hayden","Stuart"];
const $=id=>document.getElementById(id);
const TKEY="planner.v1";
let tasks=JSON.parse(localStorage.getItem(TKEY)||"[]");
const tsave=()=>localStorage.setItem(TKEY,JSON.stringify(tasks));
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));

function currentShift(d=new Date()){const h=d.getHours();return h>=5&&h<17?"Day":"Night"}
// Night shift after midnight belongs to the date it started
function shiftDate(d=new Date()){const x=new Date(d);if(d.getHours()<5)x.setDate(x.getDate()-1);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}

USERS.forEach(n=>{$("from").add(new Option(n,n));$("to").add(new Option(n,n))});
function defaults(){
  if(ss.cur)$("from").value=ss.cur.user;
  $("shift").value=currentShift();$("date").value=shiftDate();setTo();
}
// 21-day cycle: 7 days, 7 nights, 7 off. Offsets from Tue 17 Nov 2026 (Carl's first day shift).
const REF=new Date(2026,10,17), OFFSET={Carl:0,Lockie:7,Declan:14};
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmtD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function pos(n,d){const k=Math.round((d-REF)/864e5);return (((k+OFFSET[n])%21)+21)%21}
function status(n,d){const p=pos(n,d);return p<7?"D":p<14?"N":"O"}
function whoOn(d,sh){return CREW.find(n=>status(n,d)===(sh==="Day"?"D":"N"))}
function setTo(){ // default: whoever is rostered on the next shift
  const d=parseD($("date").value),sh=$("shift").value;
  $("to").value=sh==="Day"?whoOn(d,"Night"):whoOn(addDays(d,1),"Day")}
const NOTE={0:"first day shift",6:"last day shift",7:"first night shift",13:"last night shift – then 7 days off"};
function renderRoster(){
  const t=parseD(shiftDate()),sh=currentShift();
  $("rtoday").textContent=`— now: Day ${whoOn(t,"Day")}, Night ${whoOn(t,"Night")}`;
  let h="<table class='r'><tr><th>Date</th>"+CREW.map(n=>`<th>${n}</th>`).join("")+"</tr>";
  for(let i=-1;i<21;i++){const d=addDays(t,i);
    h+=`<tr class="${i===0?"today":""}"><th>${d.toLocaleDateString([],{weekday:"short",day:"numeric",month:"short"})}</th>`+
      CREW.map(n=>{const st=status(n,d),p=pos(n,d);
        return `<td class="${st}">${{D:"Day",N:"Night",O:"Off"}[st]}${NOTE[p]?`<br><small>${NOTE[p]}</small>`:""}</td>`}).join("")+"</tr>"}
  $("roster").innerHTML=h+"</table>"}
$("from").disabled=true;
$("shift").onchange=$("date").onchange=setTo;
$("form").addEventListener("reset",()=>setTimeout(defaults));

$("form").onsubmit=e=>{
  e.preventDefault();
  if($("from").value===$("to").value&&!confirm("Handing over to yourself – continue?"))return;
  const chk=[...document.querySelectorAll(".chk")];
  const h={id:Date.now(),created:new Date().toISOString(),from:$("from").value,to:$("to").value,
    shift:$("shift").value,date:$("date").value,inprog:$("inprog").value,done:$("done").value,
    parts:$("parts").value,equip:$("equip").value,safety:$("safety").value,notes:$("notes").value,
    open:tasks.filter(t=>!t.done).map(t=>(t.type==="order"?"ORDER: ":"")+t.text+(t.qty>1?" ×"+t.qty:"")),
    checks:chk.filter(c=>c.checked).length+"/"+chk.length,ack:null};
  data.unshift(h);
  save();pushH(h);$("form").reset();render();window.scrollTo(0,0);
};

const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function body(h){
  const f=[["Jobs in progress","inprog"],["Completed","done"],["Parts / stock","parts"],["Equipment","equip"],["Safety","safety"],["Notes","notes"]];
  return f.filter(([,k])=>h[k].trim()).map(([t,k])=>`<b class="${k==="safety"?"flag":""}">${t}</b><pre>${esc(h[k])}</pre>`).join("")
    +(h.open&&h.open.length?`<b>Rolled over (not done)</b><pre>${esc(h.open.map(x=>"• "+x).join("\n"))}</pre>`:"")
    +`<small>Checklist ${h.checks}</small>`;
}
function entry(h){
  const d=new Date(h.created).toLocaleString();
  return `<div class="entry ${h.shift.toLowerCase()}"><b>${h.shift} shift ${h.date}</b> — ${h.from} → ${h.to}<br><small>${d}</small>
  ${body(h)}<div class="actions">
  ${h.ack?`<span class="ack">✔ Acknowledged by ${h.ack.by} ${new Date(h.ack.at).toLocaleString()}</span>`
    :`<button data-ack="${h.id}" ${h.to!==$("from").value?"disabled":""}>I've read this (${h.to})</button>`}
  <button class="sec" data-copy="${h.id}">Copy</button><button class="sec" data-del="${h.id}">Delete</button></div></div>`;
}
function render(){
  spawnRecurring();
  const me=$("from").value;
  const p=data.filter(h=>h.to===me&&!h.ack);
  $("pending").innerHTML=p.length?`<div class="card"><h2>⚠ Handovers waiting for ${me} (${p.length})</h2>${p.map(entry).join("")}</div>`:"";
  $("history").innerHTML=data.length?data.map(entry).join(""):"<p>No handovers yet.</p>";
  renderTasks();renderRoster();
  $("onshift").textContent=ss.cur?"👤 "+ss.cur.user+" since "+new Date(ss.cur.at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
  $("signoff").style.display=ss.cur?"":"none";
  $("banner").innerHTML=ss.cur&&ss.cur.shiftKey!==here()?`<div class="card"><h2 style="color:#fff">⏰ Shift change – ${ss.cur.user} is still signed on from ${ss.cur.shiftKey}</h2><p>Finish the handover, then the incoming person signs on.</p><button id="bsign">Sign on for ${here()}</button></div>`:"";
  $("now").textContent=currentShift()+" shift • "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}
const here=()=>currentShift()+" "+shiftDate();
// ---- recurring weekly tasks (dow: 0=Sun..6=Sat) ----
const RECUR=[
  {dow:1,shift:"Day",text:"Check with Stores Port Hedland that cages will be returned to suppliers"},
  {dow:3,shift:"Night",text:"Stock count – McPhee ROM"},
  {dow:3,shift:"Day",text:"Follow up open purchase orders with suppliers"},
  {dow:4,shift:"Day",text:"Check if waste oil IBCs have been organised"},
  {dow:2,shift:"Day",text:"Tyre orders – check if placed"},
  {dow:2,shift:"Night",text:"Check oils and lubricants"},
  {dow:4,shift:"Night",text:"Check sundries and re-order"},
];
const RSEEN="recur.seen.v1";
let rseen=JSON.parse(localStorage.getItem(RSEEN)||"[]").filter(id=>Date.now()-id<30*864e5);
function spawnRecurring(){
  const date=shiftDate(),sh=currentShift(),dow=parseD(date).getDay();
  let added=false;
  RECUR.forEach((r,i)=>{
    if(r.dow!==dow||r.shift!==sh)return;
    const id=parseD(date).getTime()+5*36e5+i; // deterministic per occurrence so devices don't duplicate
    if(rseen.includes(id)||tasks.some(t=>t.id===id))return;
    const t={id,type:"task",recur:true,text:r.text,by:"Recurring",shiftKey:here(),done:false};
    tasks.push(t);pushT(t);rseen.push(id);added=true});
  if(added){tasks.sort((a,b)=>a.id-b.id);tsave();localStorage.setItem(RSEEN,JSON.stringify(rseen))}}
function renderTasks(){
  const cur=here();
  const open=tasks.filter(t=>!t.done), done=tasks.filter(t=>t.done&&t.doneShift===cur);
  const row=t=>{const roll=!t.done&&t.shiftKey!==cur;
    return `<div class="task ${t.done?"done":""}"><input type="checkbox" data-tick="${t.id}" ${t.done?"checked":""}>
    <div><span><span class="tag ${t.type}">${t.type==="order"?"ORDER":"TASK"}</span>${t.recur?'<span class="tag recur">🔁 WEEKLY</span>':""}${roll?'<span class="tag roll">ROLLED OVER</span>':""}${esc(t.text)}${t.qty>1?" ×"+t.qty:""}</span>
    <small class="m">Added by ${t.by} – ${t.shiftKey}${t.done?` • done by ${t.doneBy}`:""}</small></div>
    <button class="sec" data-tdel="${t.id}">✕</button></div>`};
  $("tasks").innerHTML=(open.length?open.map(row).join(""):"<p>Nothing outstanding 🎉</p>")
    +(done.length?`<small>Done this shift</small>`+done.map(row).join(""):"");
}
$("tform").onsubmit=e=>{e.preventDefault();
  const t={id:Date.now(),text:$("ttext").value.trim(),type:$("ttype").value,by:$("from").value,shiftKey:here(),done:false};
  tasks.push(t);
  tsave();pushT(t);$("ttext").value="";render()};
document.addEventListener("click",e=>{
  if(e.target.dataset.tdel){const id=e.target.dataset.tdel;
    tasks=tasks.filter(x=>x.id!=id);tsave();pushDel("task:"+id,"task");render();return}
  const t=e.target.dataset;
  if(t.ack){const h=data.find(x=>x.id==t.ack);h.ack={by:$("from").value,at:new Date().toISOString()};save();pushH(h);render()}
  if(t.del&&confirm("Delete this handover?")){data=data.filter(x=>x.id!=t.del);save();pushDel("handover:"+t.del,"handover");render()}
  if(t.copy){const h=data.find(x=>x.id==t.copy);
    const txt=`${h.shift} shift ${h.date}: ${h.from} -> ${h.to}\n`+[["In progress","inprog"],["Completed","done"],["Parts","parts"],["Equipment","equip"],["Safety","safety"],["Notes","notes"]]
      .filter(([,k])=>h[k].trim()).map(([a,k])=>`${a}: ${h[k]}`).join("\n");
    navigator.clipboard.writeText(txt).then(()=>alert("Copied"))}
});
document.addEventListener("change",e=>{const id=e.target.dataset.tick;if(!id)return;
  const t=tasks.find(x=>x.id==id);t.done=e.target.checked;
  t.doneBy=t.done?$("from").value:null;t.doneShift=t.done?here():null;
  const old=tasks.filter(x=>x.done&&Date.now()-x.id>=30*864e5);
  tasks=tasks.filter(x=>!x.done||Date.now()-x.id<30*864e5);
  tsave();pushT(t);old.forEach(x=>pushDel("task:"+x.id,"task"));render()});
$("export").onclick=()=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  a.download="handovers.json";a.click()};
$("clear").onclick=()=>{if(confirm("Delete ALL handovers?")){data.forEach(h=>pushDel("handover:"+h.id,"handover"));data=[];save();render()}};
// ---- auto-grow textareas ----
const grow=t=>{t.style.height="auto";t.style.height=t.scrollHeight+2+"px"};
document.addEventListener("input",e=>{if(e.target.tagName==="TEXTAREA")grow(e.target)});
$("form").addEventListener("reset",()=>setTimeout(()=>document.querySelectorAll("textarea").forEach(grow)));
// ---- barcode scan to order ----
const PT="https://9h2c8tksrk-lgtm.github.io/Parts-tracker/";
let parts=null,scanner=null,lastScan={c:"",t:0};
async function loadParts(){
  if(parts)return parts;
  try{parts=await(await fetch(PT+"master_parts_list.json")).json();localStorage.setItem("parts.cache",JSON.stringify(parts))}
  catch{parts=JSON.parse(localStorage.getItem("parts.cache")||"[]")}
  return parts}
const sb=window.supabase?supabase.createClient("https://botdhowoytwczstqrjom.supabase.co","sb_publishable_FQkw8ntiw0IT-XynvcIaJg_4wv3l5tO"):null;
let sbUser=null;
function sbStatus(){
  $("sbstat").textContent=!sb?"Parts Tracker unavailable offline – using basic parts list.":sbUser?"🔩 Parts Tracker connected: "+sbUser.email:"Not signed in to Parts Tracker – using basic parts list.";
  $("sbform").style.display=sb&&!sbUser?"block":"none"}
if(sb){sb.auth.getSession().then(({data})=>{sbUser=data.session?data.session.user:null;sbStatus();if(!sbUser)ptAutoSignIn()});
  sb.auth.onAuthStateChange((_,se)=>{sbUser=se?se.user:null;sbStatus()})}
// Remember Parts Tracker credentials on this device so signing on to shift also signs into Parts Tracker
const PTCRED="pt.cred.v1";
async function ptAutoSignIn(){
  if(!sb||sbUser||!navigator.onLine)return;
  const c=JSON.parse(localStorage.getItem(PTCRED)||"null");if(!c)return;
  const {error}=await sb.auth.signInWithPassword({email:c.email,password:c.password});
  if(error&&/credentials/i.test(error.message))localStorage.removeItem(PTCRED)}
$("sbform").onsubmit=async e=>{e.preventDefault();
  const email=$("sbemail").value.trim(),password=$("sbpass").value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  $("sbpass").value="";
  if(!error)localStorage.setItem(PTCRED,JSON.stringify({email,password}));
  $("scanmsg").textContent=error?"Sign-in failed: "+error.message:"Signed in – this device will now sign in automatically."};
const COLS="barcode,part_name,description,stock_level";
async function findPart(code){
  if(sb&&sbUser){try{
    let {data}=await sb.from("parts").select(COLS).eq("barcode",code).maybeSingle();
    if(!data){const a=await sb.from("part_barcodes").select("barcode").eq("alias",code).maybeSingle();
      if(a.data)data=(await sb.from("parts").select(COLS).eq("barcode",a.data.barcode).maybeSingle()).data}
    if(data)return data}catch{}}
  const m=(parts||[]).find(x=>String(x.Barcode).toLowerCase()===code.toLowerCase());
  return m?{barcode:m.Barcode,part_name:m.PartName,description:m.Description,stock_level:m.StockLevel}:null}
async function addOrder(raw){
  const code=raw.trim();if(!code)return;
  const p=await findPart(code);
  const key=p?p.barcode:code;
  const ex=tasks.find(t=>!t.done&&t.type==="order"&&t.code===key);
  if(ex){ex.qty++;pushT(ex)}
  else{const d=p&&p.description&&p.description!==p.part_name?" – "+p.description.slice(0,70):"";
    const t={id:Date.now(),type:"order",code:key,qty:1,by:$("from").value,shiftKey:here(),done:false,
      text:p?`${p.part_name}${d} (${key})`:`Unknown part (${code})`};
    tasks.push(t);pushT(t)}
  tsave();render();
  $("scanmsg").textContent=(p?"✔ "+p.part_name+(p.stock_level!=null?" (stock "+p.stock_level+")":""):"⚠ Not found: "+code)+(ex?" – qty "+ex.qty:" added")}
$("tscan").onclick=async()=>{
  if(!window.Html5Qrcode){alert("Scanner needs an internet connection. You can still type the item in.");return}
  await loadParts();sbStatus();$("scanbox").style.display="flex";
  scanner=new Html5Qrcode("reader");
  scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:150}},c=>{
    if(c===lastScan.c&&Date.now()-lastScan.t<3000)return;lastScan={c,t:Date.now()};addOrder(c)})
    .catch(e=>$("scanmsg").textContent="Camera unavailable ("+e+"). Type the code below.")};
$("manualadd").onclick=()=>{addOrder($("manual").value);$("manual").value=""};
$("scandone").onclick=()=>{$("scanbox").style.display="none";
  if(scanner)scanner.stop().then(()=>scanner.clear()).catch(()=>{});scanner=null};
// ---- sign on / off ----
const SKEY="shift.v1", PKEY="pins.v1";
let ss=JSON.parse(localStorage.getItem(SKEY)||'{"cur":null,"log":[]}');
const pins=JSON.parse(localStorage.getItem(PKEY)||"{}");
const ssave=()=>localStorage.setItem(SKEY,JSON.stringify(ss));
async function hash(pin){
  const t="handover:"+pin;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  let h=5381;for(const c of t)h=(h*33)^c.charCodeAt(0);return "d"+(h>>>0)}
USERS.forEach(n=>$("su").add(new Option(n,n)));
function openLock(){$("su").value=whoOn(parseD(shiftDate()),currentShift());showLock()}
function showLock(){
  $("lockinfo").textContent=ss.cur?`${ss.cur.user} is on shift. Signing on will sign them off.`:"Nobody is signed on.";
  $("spin").value=$("spin2").value="";$("lockerr").textContent="";
  $("newpin").style.display=pins[$("su").value]?"none":"block";
  $("lock").style.display="flex";$("spin").focus()}
$("su").onchange=showLock;
$("signoff").onclick=()=>{if(!confirm("Sign off "+ss.cur.user+"?"))return;
  ss.cur.off=new Date().toISOString();ss.log.push(ss.cur);ss.cur=null;ssave();pushShift();render();openLock()};
document.addEventListener("click",e=>{if(e.target.id==="bsign")openLock()});
$("lockform").onsubmit=async e=>{
  e.preventDefault();const u=$("su").value,pin=$("spin").value,err=m=>$("lockerr").textContent=m;
  if(!/^\d{4,6}$/.test(pin))return err("PIN must be 4–6 digits");
  if(!pins[u]&&sb&&navigator.onLine){ // PIN may exist on another device – check server first
    try{const {data:pr}=await sb.from("handover_sync").select("value").eq("id","pin:"+u).maybeSingle();
      if(pr&&pr.value&&pr.value.hash){pins[u]=pr.value.hash;localStorage.setItem(PKEY,JSON.stringify(pins))}}catch{}}
  const hp=await hash(pin);
  if(!pins[u]){if(pin!==$("spin2").value)return err("PINs don't match");pins[u]=hp;localStorage.setItem(PKEY,JSON.stringify(pins));pushPin(u)}
  else if(pins[u]!==hp)return err("Wrong PIN");
  const rost=whoOn(parseD(shiftDate()),currentShift());
  if(rost!==u&&!confirm(`${rost} is rostered on this ${currentShift().toLowerCase()} shift, not ${u}. Sign on anyway (covering)?`))return;
  const c=ss.cur;
  if(c&&(c.user!==u||c.shiftKey!==here())){
    if(c.user!==u&&!data.some(h=>h.from===c.user&&h.created>=c.at)&&
       !confirm(c.user+" hasn't submitted a handover this shift. Sign them off anyway?"))return;
    c.off=new Date().toISOString();c.offBy=u;ss.log.push(c);ss.cur=null}
  if(!ss.cur)ss.cur={user:u,at:new Date().toISOString(),shiftKey:here()};
  ssave();pushShift();$("lock").style.display="none";defaults();render();ptAutoSignIn()};
// ---- cross-device sync (Supabase handover_sync table) ----
const SOUT="sync.out.v1", SLAST="sync.last.v1";
let out=JSON.parse(localStorage.getItem(SOUT)||"[]"), lastSync=localStorage.getItem(SLAST)||"";
let applying=false, flushing=false, pullOk=null;
const osave=()=>localStorage.setItem(SOUT,JSON.stringify(out));
function syncUI(){
  const s=$("sync");if(!sb){s.textContent="";return}
  s.textContent=out.length?"⇡ "+out.length+" to sync":pullOk===false?"⚠ sync offline":pullOk?"☁ synced":"";
  s.style.color=out.length||pullOk===false?"#7a2a2a":"#3a6"}
function qpush(id,kind,value){
  if(applying)return;
  out=out.filter(o=>o.id!==id);out.push({id,kind,value});osave();syncUI();flush()}
function pushH(h){qpush("handover:"+h.id,"handover",h)}
function pushT(t){qpush("task:"+t.id,"task",t)}
function pushDel(id,kind){qpush(id,kind,{deleted:true})}
function pushPin(u){qpush("pin:"+u,"pin",{hash:pins[u]})}
function pushShift(){qpush("shift:current","shift",{cur:ss.cur})}
async function flush(){
  if(!sb||flushing||!out.length||!navigator.onLine)return;
  flushing=true;
  try{while(out.length){
    const b=out.slice(0,50);
    const {error}=await sb.from("handover_sync").upsert(b.map(o=>({id:o.id,kind:o.kind,value:o.value})));
    if(error)break;
    out.splice(0,b.length);osave()}}
  finally{flushing=false;syncUI()}}
function applyRow(r){
  const v=r.value||{};
  if(r.kind==="handover"){const id=+r.id.slice(9);
    data=data.filter(h=>h.id!==id);
    if(!v.deleted){data.push(v);data.sort((a,b)=>b.id-a.id)}}
  else if(r.kind==="task"){const id=+r.id.slice(5);
    tasks=tasks.filter(t=>t.id!==id);
    if(!v.deleted){tasks.push(v);tasks.sort((a,b)=>a.id-b.id)}
    else if(!rseen.includes(id)){rseen.push(id);localStorage.setItem(RSEEN,JSON.stringify(rseen))}}
  else if(r.kind==="pin"){const u=r.id.slice(4);if(v.hash)pins[u]=v.hash}
  else if(r.kind==="shift")ss.cur=v.cur||null}
async function pull(){
  if(!sb||!navigator.onLine){syncUI();return}
  const first=!lastSync;
  let q=sb.from("handover_sync").select("id,kind,value,updated_at").order("updated_at",{ascending:true}).limit(1000);
  if(lastSync)q=q.gt("updated_at",lastSync);
  const {data:rows,error}=await q;
  if(error){pullOk=false;syncUI();return}
  pullOk=true;
  const pend=new Set(out.map(o=>o.id)), seen=new Set(), prevCur=JSON.stringify(ss.cur);
  applying=true;
  for(const r of rows){seen.add(r.id);lastSync=r.updated_at;if(!pend.has(r.id))applyRow(r)}
  applying=false;
  if(!lastSync)lastSync="1970-01-01T00:00:00+00:00";
  localStorage.setItem(SLAST,lastSync);
  if(first){ // seed server with anything this device already had
    data.forEach(h=>{if(!seen.has("handover:"+h.id))pushH(h)});
    tasks.forEach(t=>{if(!seen.has("task:"+t.id))pushT(t)});
    Object.keys(pins).forEach(u=>{if(!seen.has("pin:"+u))pushPin(u)});
    if(ss.cur&&!seen.has("shift:current"))pushShift()}
  if(!rows.length){syncUI();return}
  save();tsave();ssave();localStorage.setItem(PKEY,JSON.stringify(pins));
  if(JSON.stringify(ss.cur)!==prevCur){ // signed on/off from another device
    if(ss.cur&&$("lock").style.display==="flex"){$("lock").style.display="none";defaults()}
    if(!ss.cur&&$("lock").style.display!=="flex")openLock()}
  render();flush();syncUI()}
window.addEventListener("online",()=>{flush();pull()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
setInterval(pull,20000);
pull();flush();syncUI();
defaults();render();setInterval(render,60000);
if(!ss.cur)openLock();
</script>
